<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" font-family="Inter, Segoe UI, sans-serif">
  <rect width="680" height="250" fill="#f8fafc"/>
  <text x="340" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Le voyant « Aérez ! » de la salle, prototypé sur Wokwi</text>
  <!-- salle -->
  <rect x="20" y="56" width="130" height="130" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <text x="85" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Salle de classe</text>
  <g fill="#94a3b8">
    <circle cx="55" cy="112" r="9"/><circle cx="85" cy="112" r="9"/><circle cx="115" cy="112" r="9"/>
    <circle cx="55" cy="148" r="9"/><circle cx="85" cy="148" r="9"/><circle cx="115" cy="148" r="9"/>
  </g>
  <text x="85" y="178" text-anchor="middle" font-size="11" fill="#64748b">air chargé en CO₂</text>
  <!-- fleche -->
  <path d="M152 121 h28" stroke="#475569" stroke-width="2.5"/><path d="M180 114 l10 7 l-10 7z" fill="#475569"/>
  <!-- capteur simule -->
  <rect x="194" y="56" width="140" height="130" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/>
  <text x="264" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#c2410c">Capteur de CO₂</text>
  <circle cx="264" cy="122" r="22" fill="#fff" stroke="#c2410c" stroke-width="2.5"/>
  <line x1="264" y1="122" x2="278" y2="106" stroke="#c2410c" stroke-width="3" stroke-linecap="round"/>
  <text x="264" y="162" text-anchor="middle" font-size="11" fill="#c2410c">simulé par un</text>
  <text x="264" y="176" text-anchor="middle" font-size="11" fill="#c2410c">potentiomètre</text>
  <!-- fleche -->
  <path d="M336 121 h28" stroke="#475569" stroke-width="2.5"/><path d="M364 114 l10 7 l-10 7z" fill="#475569"/>
  <text x="356" y="106" text-anchor="middle" font-size="10" font-weight="700" fill="#c2410c">0–3 V</text>
  <!-- arduino -->
  <rect x="378" y="56" width="150" height="130" rx="10" fill="#0e7490"/>
  <text x="453" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">ESP32</text>
  <text x="453" y="112" text-anchor="middle" font-size="11" fill="#cffafe">CAN 12 bits, 3,3 V</text>
  <text x="453" y="138" text-anchor="middle" font-size="12" font-family="Fira Code, Consolas, monospace" fill="#fff">N → V → ppm</text>
  <text x="453" y="164" text-anchor="middle" font-size="11" fill="#cffafe">programme MicroPython</text>
  <!-- fleche -->
  <path d="M530 121 h28" stroke="#475569" stroke-width="2.5"/><path d="M558 114 l10 7 l-10 7z" fill="#475569"/>
  <!-- voyant -->
  <rect x="572" y="56" width="90" height="130" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="617" cy="108" r="20" fill="#f97316"/>
  <circle cx="617" cy="108" r="28" fill="none" stroke="#f97316" stroke-width="2" opacity=".5"/>
  <text x="617" y="158" text-anchor="middle" font-size="13" font-weight="800" fill="#dc2626">Aérez !</text>
  <text x="617" y="175" text-anchor="middle" font-size="10" fill="#64748b">si C &gt; 1 500 ppm</text>
  <text x="340" y="214" text-anchor="middle" font-size="12" fill="#64748b">Wokwi n'a pas de capteur de CO₂ analogique : un potentiomètre fournit la même tension que lui.</text>
  <text x="340" y="232" text-anchor="middle" font-size="12" fill="#64748b">Tu le tournes pour « faire monter le CO₂ » dans la salle.</text>
</svg>
