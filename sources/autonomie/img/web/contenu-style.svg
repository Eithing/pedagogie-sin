<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="Inter, Segoe UI, sans-serif">
  <rect width="640" height="260" fill="#f8fafc"/>
  <text x="320" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Même contenu (HTML), deux styles (CSS)</text>
  <!-- sans CSS -->
  <rect x="30" y="44" width="260" height="196" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="30" y="44" width="260" height="20" rx="8" fill="#e2e8f0"/>
  <circle cx="44" cy="54" r="4" fill="#94a3b8"/><circle cx="56" cy="54" r="4" fill="#94a3b8"/>
  <text x="44" y="94" font-family="Times New Roman, serif" font-size="22" font-weight="700" fill="#000">Ma passion : le judo</text>
  <text x="44" y="120" font-family="Times New Roman, serif" font-size="13" fill="#000">Je pratique le judo depuis 6 ans…</text>
  <text x="44" y="146" font-family="Times New Roman, serif" font-size="16" font-weight="700" fill="#000">Mes compétitions</text>
  <text x="44" y="168" font-family="Times New Roman, serif" font-size="13" fill="#000">• Tournoi de Lille</text>
  <text x="44" y="186" font-family="Times New Roman, serif" font-size="13" fill="#0000ee" text-decoration="underline">Le judo sur Wikipédia</text>
  <text x="160" y="228" text-anchor="middle" font-size="12" fill="#64748b">HTML seul : le navigateur applique son style par défaut</text>
  <!-- arrow -->
  <path d="M300 140 h30" stroke="#0d9488" stroke-width="3"/><path d="M330 133 l10 7 l-10 7z" fill="#0d9488"/>
  <text x="320" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#0d9488">+ CSS</text>
  <!-- avec CSS -->
  <rect x="350" y="44" width="260" height="196" rx="8" fill="#0f172a" stroke="#0d9488" stroke-width="2"/>
  <rect x="350" y="44" width="260" height="20" rx="8" fill="#134e4a"/>
  <circle cx="364" cy="54" r="4" fill="#5eead4"/><circle cx="376" cy="54" r="4" fill="#5eead4"/>
  <text x="480" y="96" text-anchor="middle" font-size="21" font-weight="800" fill="#5eead4">Ma passion : le judo</text>
  <text x="480" y="120" text-anchor="middle" font-size="12" fill="#e2e8f0">Je pratique le judo depuis 6 ans…</text>
  <rect x="368" y="132" width="224" height="22" rx="4" fill="#134e4a"/>
  <text x="378" y="148" font-size="14" font-weight="700" fill="#fbbf24">Mes compétitions</text>
  <text x="378" y="172" font-size="12" fill="#e2e8f0">▸ Tournoi de Lille</text>
  <text x="378" y="192" font-size="12" font-weight="600" fill="#fbbf24">Le judo sur Wikipédia →</text>
  <text x="480" y="228" text-anchor="middle" font-size="12" fill="#5eead4">Avec CSS : couleurs, polices, alignements</text>
</svg>
