<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Inter, Segoe UI, sans-serif">
  <rect width="640" height="330" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Internet, ce sont les routes. Le Web, c'est un service qui les emprunte.</text>
  <!-- services -->
  <g font-size="14" font-weight="600" text-anchor="middle">
    <rect x="30" y="52" width="150" height="78" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="3"/>
    <text x="105" y="80" fill="#0f766e" font-size="17">Le Web</text>
    <text x="105" y="102" fill="#0f766e" font-weight="400" font-size="12">pages reliées par</text>
    <text x="105" y="118" fill="#0f766e" font-weight="400" font-size="12">des liens hypertextes</text>
    <rect x="200" y="64" width="120" height="54" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
    <text x="260" y="96" fill="#334155">Courrier (mail)</text>
    <rect x="335" y="64" width="120" height="54" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
    <text x="395" y="96" fill="#334155">Visio, appels</text>
    <rect x="470" y="64" width="140" height="54" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
    <text x="540" y="96" fill="#334155">Jeux en ligne</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4">
    <line x1="105" y1="130" x2="105" y2="176"/><line x1="260" y1="118" x2="260" y2="176"/>
    <line x1="395" y1="118" x2="395" y2="176"/><line x1="540" y1="118" x2="540" y2="176"/>
  </g>
  <!-- internet -->
  <rect x="30" y="176" width="580" height="134" rx="14" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/>
  <text x="320" y="204" text-anchor="middle" font-size="16" font-weight="700" fill="#3730a3">Internet : le réseau des réseaux (thème 1)</text>
  <!-- liaisons entre routeurs, dessinees avant les noeuds -->
  <g stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round">
    <line x1="90" y1="248" x2="190" y2="236"/>
    <line x1="190" y1="236" x2="290" y2="254"/>
    <line x1="290" y1="254" x2="390" y2="236"/>
    <line x1="390" y1="236" x2="480" y2="254"/>
    <line x1="480" y1="254" x2="560" y2="240"/>
    <line x1="190" y1="236" x2="390" y2="236"/>
  </g>
  <g fill="#fff" stroke="#4f46e5" stroke-width="2.5">
    <circle cx="90" cy="248" r="11"/><circle cx="190" cy="236" r="11"/><circle cx="290" cy="254" r="11"/>
    <circle cx="390" cy="236" r="11"/><circle cx="480" cy="254" r="11"/><circle cx="560" cy="240" r="11"/>
  </g>
  <text x="320" y="292" text-anchor="middle" font-size="12.5" fill="#3730a3">routeurs, câbles, fibre, 4G/5G, Wi-Fi… et le protocole TCP/IP</text>
</svg>
