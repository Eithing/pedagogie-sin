<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Inter, Segoe UI, sans-serif">
  <rect width="640" height="300" fill="#f8fafc"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">Internet, ce sont les routes. Le Web, c'est un service qui les emprunte.</text>
  <!-- services -->
  <g font-size="14" font-weight="600" text-anchor="middle">
    <rect x="30" y="52" width="150" height="74" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="3"/>
    <text x="105" y="80" fill="#0f766e" font-size="17">Le Web</text>
    <text x="105" y="102" fill="#0f766e" font-weight="400" font-size="12">pages reliées par</text>
    <text x="105" y="117" fill="#0f766e" font-weight="400" font-size="12">des liens hypertextes</text>
    <rect x="200" y="62" width="120" height="54" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
    <text x="260" y="94" fill="#334155">Courrier (mail)</text>
    <rect x="335" y="62" width="120" height="54" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
    <text x="395" y="94" fill="#334155">Visio, appels</text>
    <rect x="470" y="62" width="140" height="54" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
    <text x="540" y="94" fill="#334155">Jeux en ligne</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4">
    <line x1="105" y1="126" x2="105" y2="170"/><line x1="260" y1="116" x2="260" y2="170"/>
    <line x1="395" y1="116" x2="395" y2="170"/><line x1="540" y1="116" x2="540" y2="170"/>
  </g>
  <!-- internet -->
  <rect x="30" y="170" width="580" height="100" rx="14" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/>
  <text x="320" y="196" text-anchor="middle" font-size="17" font-weight="700" fill="#3730a3">Internet : le réseau des réseaux (thème 1)</text>
  <g fill="#fff" stroke="#4f46e5" stroke-width="2">
    <circle cx="90" cy="236" r="12"/><circle cx="190" cy="226" r="12"/><circle cx="290" cy="246" r="12"/>
    <circle cx="390" cy="228" r="12"/><circle cx="480" cy="248" r="12"/><circle cx="560" cy="230" r="12"/>
  </g>
  <g stroke="#4f46e5" stroke-width="2">
    <line x1="102" y1="234" x2="178" y2="228"/><line x1="202" y1="230" x2="278" y2="244"/>
    <line x1="302" y1="244" x2="378" y2="230"/><line x1="402" y1="232" x2="468" y2="246"/>
    <line x1="492" y1="244" x2="548" y2="232"/><line x1="200" y1="236" x2="380" y2="232"/>
  </g>
  <text x="320" y="262" text-anchor="middle" font-size="12" fill="#3730a3">routeurs, câbles, fibre, 4G/5G, Wi-Fi… et le protocole TCP/IP</text>
</svg>
