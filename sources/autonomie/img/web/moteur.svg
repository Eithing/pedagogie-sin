<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 170" width="700" height="170" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="700" height="170" fill="#ffffff"/>
  <g text-anchor="middle" fill="#0f172a">
    <rect x="10" y="34" width="190" height="96" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="105" y="58" font-size="14" font-weight="700">1. Explorer</text>
    <text x="105" y="82" font-size="12">Des robots suivent les liens</text>
    <text x="105" y="100" font-size="12">de page en page et lisent</text>
    <text x="105" y="118" font-size="12">leur contenu.</text>
    <rect x="255" y="34" width="190" height="96" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
    <text x="350" y="58" font-size="14" font-weight="700">2. Indexer</text>
    <text x="350" y="82" font-size="12">Pour chaque mot, le moteur</text>
    <text x="350" y="100" font-size="12">note les pages qui le</text>
    <text x="350" y="118" font-size="12">contiennent : c'est l'index.</text>
    <rect x="500" y="34" width="190" height="96" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="595" y="58" font-size="14" font-weight="700">3. Classer</text>
    <text x="595" y="82" font-size="12">À chaque recherche, il cherche</text>
    <text x="595" y="100" font-size="12">dans l'index et décide quelle</text>
    <text x="595" y="118" font-size="12">page afficher en premier.</text>
  </g>
  <g stroke="#334155" stroke-width="2" marker-end="url(#f)">
    <line x1="200" y1="82" x2="253" y2="82"/>
    <line x1="445" y1="82" x2="498" y2="82"/>
  </g>
  <text x="350" y="158" font-size="12" fill="#475569" text-anchor="middle">Le moteur ne fouille pas le Web au moment de ta recherche : il répond à partir de son index.</text>
</svg>
