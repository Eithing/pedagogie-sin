<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" font-family="Inter, Segoe UI, sans-serif">
  <rect width="640" height="200" fill="#f8fafc"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Décomposer une URL (adresse d'une page web)</text>
  <g font-family="Fira Code, Consolas, monospace" font-size="19" font-weight="600">
    <rect x="22" y="56" width="92" height="40" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="68" y="83" text-anchor="middle" fill="#15803d">https</text>
    <text x="126" y="83" text-anchor="middle" fill="#64748b">://</text>
    <rect x="148" y="56" width="190" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="243" y="83" text-anchor="middle" fill="#1d4ed8">fr.wikipedia.org</text>
    <rect x="346" y="56" width="138" height="40" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="415" y="83" text-anchor="middle" fill="#c2410c">/w/index.php</text>
    <rect x="492" y="56" width="128" height="40" rx="6" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="556" y="83" text-anchor="middle" fill="#6d28d9" font-size="15">?search=web</text>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="68" y="124" font-weight="700" fill="#15803d">protocole</text>
    <text x="68" y="142" fill="#334155">comment on</text><text x="68" y="158" fill="#334155">communique</text>
    <text x="68" y="174" fill="#334155">(s = sécurisé)</text>
    <text x="243" y="124" font-weight="700" fill="#1d4ed8">nom de domaine</text>
    <text x="243" y="142" fill="#334155">le serveur qui héberge la page</text>
    <text x="243" y="158" fill="#334155">(traduit en adresse IP par le DNS)</text>
    <text x="415" y="124" font-weight="700" fill="#c2410c">chemin</text>
    <text x="415" y="142" fill="#334155">où se trouve la ressource</text>
    <text x="415" y="158" fill="#334155">sur le serveur</text>
    <text x="556" y="124" font-weight="700" fill="#6d28d9">paramètres</text>
    <text x="556" y="142" fill="#334155">données envoyées</text>
    <text x="556" y="158" fill="#334155">(ici : la recherche)</text>
  </g>
</svg>
