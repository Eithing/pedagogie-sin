  <rect y="300" width="640" height="100" fill="#1e293b"/>
  <path d="M0 330 L640 316 L640 352 L0 372z" fill="#334155"/>
  <!-- Lampadaire 1 : veille 30 % -->
  <path d="M90 300 L90 150 Q90 136 104 136 L132 136" stroke="#94a3b8" stroke-width="6" fill="none"/>
  <rect x="122" y="132" width="34" height="10" rx="4" fill="#94a3b8"/>
