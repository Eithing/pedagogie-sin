  <text x="349" y="122" font-size="13" font-weight="700" fill="#fdba74" text-anchor="middle">100 %</text>
  <!-- Piéton -->
  <circle cx="352" cy="236" r="9" fill="#ea580c"/>
  <path d="M352 246 L352 276 M352 256 L340 266 M352 256 L364 264 M352 276 L342 298 M352 276 L362 298" stroke="#ea580c" stroke-width="5" stroke-linecap="round"/>
  <!-- Lampadaire 3 : veille 30 % -->
  <path d="M510 300 L510 150 Q510 136 524 136 L552 136" stroke="#94a3b8" stroke-width="6" fill="none"/>
  <rect x="542" y="132" width="34" height="10" rx="4" fill="#94a3b8"/>
  <path d="M546 142 L514 300 L610 300 L572 142z" fill="#fde68a" fill-opacity="0.18"/>
  <text x="559" y="122" font-size="13" fill="#bfdbfe" text-anchor="middle">30 %</text>

  <text x="320" y="42" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">L'allée du lycée, 22 h</text>
  <text x="320" y="68" font-size="14" fill="#cbd5e1" text-anchor="middle">Allumée à fond quand quelqu'un passe, en veille le reste de la nuit</text>
</svg>
