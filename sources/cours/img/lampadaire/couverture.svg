<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Inter, Segoe UI, sans-serif">
  <rect width="640" height="400" fill="#0f172a"/>
  <circle cx="560" cy="64" r="28" fill="#e2e8f0"/>
  <circle cx="572" cy="56" r="26" fill="#0f172a"/>
