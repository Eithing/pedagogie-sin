  <text x="139" y="122" font-size="13" fill="#bfdbfe" text-anchor="middle">30 %</text>
  <!-- Lampadaire 2 : présence 100 % -->
  <path d="M300 300 L300 150 Q300 136 314 136 L342 136" stroke="#94a3b8" stroke-width="6" fill="none"/>
  <rect x="332" y="132" width="34" height="10" rx="4" fill="#fbbf24"/>
