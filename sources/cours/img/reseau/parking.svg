<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Inter, Segoe UI, sans-serif">
  <rect width="720" height="340" fill="#ffffff"/>
  <text x="360" y="24" font-size="15" font-weight="800" fill="#0f172a" text-anchor="middle">Le parking connecté du lycée</text>

  <!-- Zone parking -->
  <rect x="14" y="42" width="372" height="282" rx="14" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="200" y="64" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">Réseau du parking : 192.168.20.0/24</text>
  <!-- Zone administration -->
  <rect x="520" y="42" width="186" height="282" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="613" y="64" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">Réseau de l'accueil</text>
  <text x="613" y="80" font-size="12" fill="#1d4ed8" text-anchor="middle">10.0.0.0/24</text>

  <!-- Capteurs -->
  <g font-size="12" fill="#334155" text-anchor="middle">
    <rect x="30" y="92" width="110" height="52" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <text x="85" y="113" font-weight="700" fill="#0f172a">Capteur P01</text>
    <text x="85" y="132">192.168.20.11</text>
    <rect x="30" y="164" width="110" height="52" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <text x="85" y="185" font-weight="700" fill="#0f172a">Capteur P02</text>
    <text x="85" y="204">192.168.20.12</text>
    <text x="85" y="238" font-size="16" fill="#64748b">⋮</text>
    <rect x="30" y="252" width="110" height="52" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <text x="85" y="273" font-weight="700" fill="#0f172a">Capteur P40</text>
    <text x="85" y="292">192.168.20.50</text>
  </g>

  <!-- Equipement A -->
  <rect x="200" y="164" width="96" height="52" rx="8" fill="#0d9488"/>
  <text x="248" y="186" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Équipement</text>
  <text x="248" y="204" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">Ⓐ</text>
  <path d="M140 118 L200 180 M140 190 L200 190 M140 278 L200 200" stroke="#475569" stroke-width="2" fill="none"/>

  <!-- Equipement B -->
  <rect x="408" y="164" width="96" height="52" rx="8" fill="#ea580c"/>
  <text x="456" y="186" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Équipement</text>
  <text x="456" y="204" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">Ⓑ</text>
  <path d="M296 190 L408 190" stroke="#475569" stroke-width="2"/>
  <text x="384" y="156" font-size="12" fill="#9a3412" text-anchor="end">192.168.20.1</text>
  <text x="528" y="156" font-size="12" fill="#9a3412" text-anchor="start">10.0.0.1</text>

  <!-- Poste accueil -->
  <path d="M504 190 L560 190" stroke="#475569" stroke-width="2"/>
  <rect x="560" y="158" width="132" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="626" y="180" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Tableau de bord</text>
  <text x="626" y="196" font-size="12" fill="#334155" text-anchor="middle">(poste de l'accueil)</text>
  <text x="626" y="212" font-size="12" fill="#334155" text-anchor="middle">10.0.0.25</text>
  <text x="613" y="300" font-size="12" fill="#475569" text-anchor="middle">« 37 places libres »</text>
