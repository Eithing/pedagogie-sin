<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" font-family="Inter, Segoe UI, sans-serif">
  <!-- Couches -->
  <g font-size="14" fill="#fff">
    <rect x="10" y="20" width="270" height="62" rx="8" fill="#0f766e"/>
    <text x="24" y="45" font-weight="700" font-size="15">Application</text>
    <text x="24" y="67">l'appli prépare la photo</text>

    <rect x="10" y="94" width="270" height="62" rx="8" fill="#7c3aed"/>
    <text x="24" y="119" font-weight="700" font-size="15">Transport — TCP</text>
    <text x="24" y="141">découpe, numérote, vérifie</text>

    <rect x="10" y="168" width="270" height="62" rx="8" fill="#0d9488"/>
    <text x="24" y="193" font-weight="700" font-size="15">Internet — IP</text>
    <text x="24" y="215">ajoute les adresses</text>

    <rect x="10" y="242" width="270" height="62" rx="8" fill="#475569"/>
    <text x="24" y="267" font-weight="700" font-size="15">Accès réseau</text>
    <text x="24" y="289">Wi-Fi, 4G, fibre : envoie les bits</text>
  </g>

  <!-- Flèche d'envoi -->
  <path d="M300 30 V290" stroke="#ea580c" stroke-width="4"/>
  <path d="M290 280 L300 300 L310 280 z" fill="#ea580c"/>
  <text x="312" y="160" font-size="12" fill="#ea580c" font-weight="700" transform="rotate(90 312 160)" text-anchor="middle">envoi</text>

  <!-- Encapsulation -->
  <g font-size="12" font-weight="700" text-anchor="middle">
    <rect x="510" y="34" width="140" height="34" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="580" y="56" fill="#0f172a">Données</text>

    <rect x="440" y="108" width="68" height="34" rx="4" fill="#7c3aed"/>
    <text x="474" y="130" fill="#fff">TCP</text>
    <rect x="510" y="108" width="140" height="34" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="580" y="130" fill="#0f172a">Données</text>

    <rect x="370" y="182" width="68" height="34" rx="4" fill="#0d9488"/>
    <text x="404" y="204" fill="#fff">IP</text>
    <rect x="440" y="182" width="68" height="34" rx="4" fill="#7c3aed"/>
    <text x="474" y="204" fill="#fff">TCP</text>
    <rect x="510" y="182" width="140" height="34" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="580" y="204" fill="#0f172a">Données</text>

    <rect x="330" y="256" width="38" height="34" rx="4" fill="#475569"/>
    <text x="349" y="278" fill="#fff" font-size="10">Wi-Fi</text>
    <rect x="370" y="256" width="68" height="34" rx="4" fill="#0d9488"/>
    <text x="404" y="278" fill="#fff">IP</text>
    <rect x="440" y="256" width="68" height="34" rx="4" fill="#7c3aed"/>
    <text x="474" y="278" fill="#fff">TCP</text>
    <rect x="510" y="256" width="140" height="34" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="580" y="278" fill="#0f172a">Données</text>
  </g>
  <text x="490" y="322" font-size="12" fill="#64748b" text-anchor="middle">chaque couche ajoute son en-tête : c'est l'encapsulation</text>
</svg>
