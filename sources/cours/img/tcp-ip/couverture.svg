<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <g id="env">
      <rect x="-15" y="-10" width="30" height="20" rx="3" fill="#ea580c"/>
      <path d="M-15 -10 L0 2 L15 -10" fill="none" stroke="#fff" stroke-width="2"/>
    </g>
  </defs>

  <!-- Fond : globe stylisé -->
  <circle cx="320" cy="205" r="175" fill="#ccfbf1"/>
  <path d="M175 160 Q320 110 465 160 M155 230 Q320 280 485 230 M320 30 Q250 205 320 380 M320 30 Q390 205 320 380" fill="none" stroke="#99f6e4" stroke-width="2"/>

  <!-- Liens entre routeurs -->
  <g stroke="#0f766e" stroke-width="4" stroke-linecap="round" opacity="0.55">
    <line x1="105" y1="205" x2="190" y2="205"/>
    <line x1="190" y1="205" x2="275" y2="125"/>
    <line x1="190" y1="205" x2="280" y2="290"/>
    <line x1="275" y1="125" x2="380" y2="150"/>
    <line x1="280" y1="290" x2="380" y2="150"/>
    <line x1="280" y1="290" x2="395" y2="300"/>
    <line x1="380" y1="150" x2="465" y2="215"/>
    <line x1="395" y1="300" x2="465" y2="215"/>
    <line x1="465" y1="215" x2="540" y2="215"/>
  </g>

  <!-- Routeurs -->
  <g fill="#0d9488" stroke="#fff" stroke-width="3">
    <circle cx="190" cy="205" r="17"/>
    <circle cx="275" cy="125" r="17"/>
    <circle cx="280" cy="290" r="17"/>
    <circle cx="380" cy="150" r="17"/>
    <circle cx="395" cy="300" r="17"/>
    <circle cx="465" cy="215" r="17"/>
  </g>
  <g stroke="#fff" stroke-width="2.2" stroke-linecap="round" fill="none">
    <path d="M182 201 h16 m-4 -4 l4 4 -4 4 M198 209 h-16 m4 -4 l-4 4 4 4"/>
    <path d="M267 121 h16 m-4 -4 l4 4 -4 4 M283 129 h-16 m4 -4 l-4 4 4 4"/>
    <path d="M272 286 h16 m-4 -4 l4 4 -4 4 M288 294 h-16 m4 -4 l-4 4 4 4"/>
    <path d="M372 146 h16 m-4 -4 l4 4 -4 4 M388 154 h-16 m4 -4 l-4 4 4 4"/>
    <path d="M387 296 h16 m-4 -4 l4 4 -4 4 M403 304 h-16 m4 -4 l-4 4 4 4"/>
    <path d="M457 211 h16 m-4 -4 l4 4 -4 4 M473 219 h-16 m4 -4 l-4 4 4 4"/>
  </g>

  <!-- Paquets en route sur des chemins différents -->
  <g font-size="12" font-weight="700" fill="#fff" text-anchor="middle">
    <use href="#env" x="232" y="165"/><text x="232" y="174">1</text>
    <use href="#env" x="330" y="137"/><text x="330" y="146">2</text>
    <use href="#env" x="237" y="248"/><text x="237" y="257">3</text>
    <use href="#env" x="338" y="295"/><text x="338" y="304">4</text>
    <use href="#env" x="430" y="258"/><text x="430" y="267">5</text>
  </g>

  <!-- Smartphone (Nice) -->
  <rect x="45" y="150" width="60" height="105" rx="10" fill="#1e293b"/>
  <rect x="51" y="162" width="48" height="80" rx="3" fill="#f0fdfa"/>
  <rect x="58" y="172" width="34" height="26" fill="#5eead4"/>
  <circle cx="68" cy="181" r="4" fill="#fde68a"/>
  <path d="M58 198 l12 -12 8 8 6 -6 8 10 z" fill="#0f766e"/>
  <text x="75" y="283" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Nice</text>

  <!-- Ordinateur portable (Montréal) -->
  <rect x="540" y="180" width="80" height="55" rx="5" fill="#1e293b"/>
  <rect x="546" y="186" width="68" height="43" fill="#f0fdfa"/>
  <rect x="530" y="235" width="100" height="8" rx="3" fill="#334155"/>
  <rect x="560" y="194" width="34" height="26" fill="#5eead4"/>
  <circle cx="570" cy="203" r="4" fill="#fde68a"/>
  <path d="M560 220 l12 -12 8 8 6 -6 8 10 z" fill="#0f766e"/>
  <text x="580" y="275" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Montréal</text>
</svg>
