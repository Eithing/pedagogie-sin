<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="Inter, Segoe UI, sans-serif">
  <text x="320" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Anatomie d'un paquet (le n° 3 sur 2 000)</text>

  <!-- En-tête IP -->
  <rect x="10" y="45" width="210" height="95" rx="8" fill="#0d9488"/>
  <text x="115" y="70" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">En-tête IP</text>
  <text x="22" y="96" fill="#fff" font-size="12.5">IP source : 82.64.12.7</text>
  <text x="22" y="120" fill="#fff" font-size="12.5">IP destination : 24.200.15.3</text>

  <!-- En-tête TCP -->
  <rect x="226" y="45" width="180" height="95" rx="8" fill="#7c3aed"/>
  <text x="316" y="70" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">En-tête TCP</text>
  <text x="238" y="96" fill="#fff" font-size="12.5">N° du paquet : 3</text>
  <text x="238" y="120" fill="#fff" font-size="12.5">Code de contrôle</text>

  <!-- Données -->
  <rect x="412" y="45" width="218" height="95" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-dasharray="6 4" stroke-width="2"/>
  <text x="521" y="70" text-anchor="middle" fill="#0f172a" font-size="15" font-weight="700">Données</text>
  <rect x="440" y="84" width="54" height="40" fill="#5eead4"/>
  <circle cx="452" cy="95" r="5" fill="#fde68a"/>
  <path d="M440 124 l18 -18 12 12 9 -9 15 15 z" fill="#0f766e"/>
  <text x="504" y="100" fill="#334155" font-size="12">un morceau</text>
  <text x="504" y="117" fill="#334155" font-size="12">de la photo</text>

  <!-- Rôles -->
  <g font-size="13" fill="#334155">
    <path d="M18 152 v8 h194 v-8" fill="none" stroke="#0d9488" stroke-width="2"/>
    <text x="115" y="182" text-anchor="middle" font-weight="700" fill="#0f766e">IP : où aller ?</text>
    <text x="115" y="201" text-anchor="middle">les routeurs lisent</text>
    <text x="115" y="218" text-anchor="middle">l'adresse de destination</text>

    <path d="M234 152 v8 h164 v-8" fill="none" stroke="#7c3aed" stroke-width="2"/>
    <text x="316" y="182" text-anchor="middle" font-weight="700" fill="#6d28d9">TCP : tout est arrivé ?</text>
    <text x="316" y="201" text-anchor="middle">remettre dans l'ordre,</text>
    <text x="316" y="218" text-anchor="middle">redemander les manquants</text>

    <path d="M420 152 v8 h202 v-8" fill="none" stroke="#64748b" stroke-width="2"/>
    <text x="521" y="182" text-anchor="middle" font-weight="700" fill="#0f172a">Ce que l'on envoie</text>
    <text x="521" y="201" text-anchor="middle">environ 1 400 octets</text>
    <text x="521" y="218" text-anchor="middle">de la photo</text>
  </g>
</svg>
