<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Inter, Segoe UI, sans-serif">
  <!-- Liens -->
  <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round">
    <line x1="120" y1="170" x2="190" y2="170"/>
    <line x1="190" y1="170" x2="300" y2="85"/>
    <line x1="190" y1="170" x2="300" y2="255"/>
    <line x1="300" y1="85" x2="430" y2="105"/>
    <line x1="300" y1="255" x2="430" y2="105"/>
    <line x1="300" y1="255" x2="430" y2="265"/>
    <line x1="430" y1="105" x2="545" y2="170"/>
    <line x1="430" y1="265" x2="545" y2="170"/>
    <line x1="545" y1="170" x2="610" y2="170"/>
  </g>

  <!-- Routeurs -->
  <g fill="#0d9488" stroke="#fff" stroke-width="4">
    <circle cx="190" cy="170" r="27"/>
    <circle cx="300" cy="85" r="27"/>
    <circle cx="300" cy="255" r="27"/>
    <circle cx="430" cy="105" r="27"/>
    <circle cx="430" cy="265" r="27"/>
    <circle cx="545" cy="170" r="27"/>
  </g>
  <g fill="#fff" font-size="18" font-weight="700" text-anchor="middle">
    <text x="190" y="176">R1</text>
    <text x="300" y="91">R2</text>
    <text x="300" y="261">R3</text>
    <text x="430" y="111">R4</text>
    <text x="430" y="271">R5</text>
    <text x="545" y="176">R6</text>
  </g>

  <!-- Extrémités -->
  <rect x="20" y="140" width="100" height="60" rx="10" fill="#1e293b"/>
  <text x="70" y="166" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">Nice</text>
  <text x="70" y="186" text-anchor="middle" fill="#99f6e4" font-size="12">expéditeur</text>
  <rect x="610" y="140" width="100" height="60" rx="10" fill="#1e293b"/>
  <text x="660" y="166" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">Montréal</text>
  <text x="660" y="186" text-anchor="middle" fill="#99f6e4" font-size="12">destinataire</text>
</svg>
