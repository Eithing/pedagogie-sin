<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#ea580c"/>
    </marker>
    <marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#15803d"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#ffffff"/>

  <!-- Acteurs -->
  <rect x="30" y="14" width="150" height="50" rx="10" fill="#0d9488"/>
  <text x="105" y="36" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Navigateur</text>
  <text x="105" y="54" font-size="12" fill="#ccfbf1" text-anchor="middle">le client</text>
  <rect x="245" y="14" width="150" height="50" rx="10" fill="#475569"/>
  <text x="320" y="36" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Serveur DNS</text>
  <text x="320" y="54" font-size="12" fill="#e2e8f0" text-anchor="middle">l'annuaire</text>
  <rect x="460" y="14" width="150" height="50" rx="10" fill="#475569"/>
  <text x="535" y="36" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Serveur web</text>
  <text x="535" y="54" font-size="12" fill="#e2e8f0" text-anchor="middle">héberge le site</text>

  <!-- Lignes de vie -->
  <line x1="105" y1="64" x2="105" y2="340" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="320" y1="64" x2="320" y2="340" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="535" y1="64" x2="535" y2="340" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- 1 -->
  <line x1="108" y1="100" x2="316" y2="100" stroke="#ea580c" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="212" y="92" font-size="12" fill="#9a3412" text-anchor="middle">① IP de cantine.lycee-exemple.fr ?</text>
  <!-- 2 -->
  <line x1="316" y1="140" x2="108" y2="140" stroke="#15803d" stroke-width="2.5" marker-end="url(#v)"/>
  <text x="212" y="132" font-size="12" fill="#166534" text-anchor="middle">② c'est 192.0.2.80</text>
  <!-- 3 -->
  <line x1="108" y1="190" x2="531" y2="190" stroke="#ea580c" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="320" y="182" font-size="12" fill="#9a3412" text-anchor="middle">③ requête HTTP : GET /menu.html?jour=lundi</text>
  <!-- 4 -->
  <line x1="531" y1="240" x2="108" y2="240" stroke="#15803d" stroke-width="2.5" marker-end="url(#v)"/>
  <text x="320" y="232" font-size="12" fill="#166534" text-anchor="middle">④ réponse HTTP : 200 OK + le code HTML de la page</text>
  <!-- 5 -->
  <rect x="34" y="268" width="142" height="54" rx="8" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
  <text x="105" y="290" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">⑤ le navigateur</text>
  <text x="105" y="308" font-size="12" fill="#166534" text-anchor="middle">affiche la page</text>
  <text x="430" y="300" font-size="12" fill="#475569" text-anchor="middle">Tous ces messages voyagent dans des paquets</text>
  <text x="430" y="318" font-size="12" fill="#475569" text-anchor="middle">TCP/IP, comme au thème Internet.</text>
</svg>
