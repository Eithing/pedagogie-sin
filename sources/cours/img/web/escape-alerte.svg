    <rect x="640" y="280" width="60" height="80" rx="10" fill="#ffffff"/><text x="670" y="334">?</text>
    <rect x="710" y="280" width="60" height="80" rx="10" fill="#ffffff"/><text x="740" y="334">?</text>
