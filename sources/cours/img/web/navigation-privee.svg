<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Navigation privée : discrète sur l'appareil, visible sur le réseau</text>
  <!-- appareil -->
  <rect x="20" y="56" width="230" height="210" rx="12" fill="#f3e8ff" stroke="#7c3aed" stroke-width="3"/>
  <text x="135" y="86" text-anchor="middle" font-size="18" font-weight="800" fill="#6d28d9">Sur ton appareil</text>
  <g font-size="15" fill="#0f172a">
    <text x="40" y="124">✗ pas d'historique</text>
    <text x="40" y="156">✗ cookies effacés</text>
    <text x="58" y="176" font-size="13" fill="#475569">à la fermeture</text>
    <text x="40" y="206">✗ pas de formulaires</text>
    <text x="58" y="226" font-size="13" fill="#475569">mémorisés</text>
  </g>
  <!-- reseau -->
  <line x1="256" y1="160" x2="300" y2="160" stroke="#475569" stroke-width="3" marker-end="url(#g)"/>
  <rect x="306" y="56" width="434" height="210" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
  <text x="523" y="86" text-anchor="middle" font-size="18" font-weight="800" fill="#c2410c">Ils voient toujours tes connexions</text>
  <g text-anchor="middle">
    <rect x="322" y="106" width="128" height="120" rx="10" fill="#ffffff" stroke="#fdba74"/>
    <text x="386" y="150" font-size="15" font-weight="700" fill="#0f172a">Le réseau</text>
    <text x="386" y="170" font-size="15" font-weight="700" fill="#0f172a">du lycée</text>
    <text x="386" y="196" font-size="13" fill="#475569">ou de la maison</text>
    <rect x="459" y="106" width="128" height="120" rx="10" fill="#ffffff" stroke="#fdba74"/>
    <text x="523" y="150" font-size="15" font-weight="700" fill="#0f172a">Le fournisseur</text>
    <text x="523" y="170" font-size="15" font-weight="700" fill="#0f172a">d'accès</text>
    <text x="523" y="196" font-size="13" fill="#475569">(box, 4G)</text>
    <rect x="596" y="106" width="128" height="120" rx="10" fill="#ffffff" stroke="#fdba74"/>
    <text x="660" y="150" font-size="15" font-weight="700" fill="#0f172a">Les sites</text>
    <text x="660" y="170" font-size="15" font-weight="700" fill="#0f172a">visités</text>
    <text x="660" y="196" font-size="13" fill="#475569">(adresse IP)</text>
  </g>
  <text x="380" y="290" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Navigation privée ≠ invisible.</text>
</svg>
