<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#0d9488"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">CSS : une règle de style pour une balise</text>
  <!-- regle -->
  <rect x="20" y="56" width="420" height="70" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <g font-family="Fira Code, Consolas, monospace" font-size="30" font-weight="600">
    <text x="44" y="102"><tspan fill="#2563eb">h1</tspan><tspan fill="#0f172a"> { </tspan><tspan fill="#ea580c">color</tspan><tspan fill="#0f172a">: </tspan><tspan fill="#15803d">red</tspan><tspan fill="#0f172a">; }</tspan></text>
  </g>
  <g font-size="14" text-anchor="middle">
    <line x1="62" y1="130" x2="62" y2="156" stroke="#2563eb" stroke-width="2"/>
    <text x="62" y="174" font-weight="700" fill="#1d4ed8">sélecteur</text>
    <text x="62" y="192" fill="#1d4ed8">quelle balise ?</text>
    <line x1="200" y1="130" x2="200" y2="156" stroke="#ea580c" stroke-width="2"/>
    <text x="200" y="174" font-weight="700" fill="#c2410c">propriété</text>
    <text x="200" y="192" fill="#c2410c">quoi changer ?</text>
    <line x1="318" y1="130" x2="318" y2="156" stroke="#15803d" stroke-width="2"/>
    <text x="318" y="174" font-weight="700" fill="#15803d">valeur</text>
    <text x="318" y="192" fill="#15803d">comment ?</text>
  </g>
  <!-- resultat -->
  <line x1="448" y1="91" x2="498" y2="91" stroke="#0d9488" stroke-width="3" marker-end="url(#fl)"/>
  <rect x="510" y="50" width="230" height="150" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="510" y="50" width="230" height="22" rx="10" fill="#e2e8f0"/>
  <text x="625" y="112" text-anchor="middle" font-size="24" font-weight="800" fill="#dc2626">Mon club de judo</text>
  <text x="625" y="144" text-anchor="middle" font-size="13" fill="#334155">Entraînement le mercredi.</text>
  <text x="625" y="186" text-anchor="middle" font-size="12" fill="#64748b">le titre h1 s'affiche en rouge</text>
  <!-- autres proprietes -->
  <rect x="20" y="218" width="720" height="66" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <g font-family="Fira Code, Consolas, monospace" font-size="15" font-weight="700" fill="#c2410c">
    <text x="40" y="246">color</text><text x="270" y="246">background-color</text><text x="560" y="246">font-size</text>
  </g>
  <g font-size="14" fill="#334155">
    <text x="40" y="270">couleur du texte</text><text x="270" y="270">couleur du fond</text><text x="560" y="270">taille du texte</text>
  </g>
</svg>
