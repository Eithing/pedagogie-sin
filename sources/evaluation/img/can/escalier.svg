<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <!-- Quadrillage -->
  <g stroke="#e2e8f0">
    <line x1="60" y1="250" x2="460" y2="250"/><line x1="60" y1="220" x2="460" y2="220"/><line x1="60" y1="190" x2="460" y2="190"/>
    <line x1="60" y1="160" x2="460" y2="160"/><line x1="60" y1="130" x2="460" y2="130"/><line x1="60" y1="100" x2="460" y2="100"/>
    <line x1="60" y1="70" x2="460" y2="70"/>
    <line x1="110" y1="40" x2="110" y2="280"/><line x1="160" y1="40" x2="160" y2="280"/><line x1="210" y1="40" x2="210" y2="280"/>
    <line x1="260" y1="40" x2="260" y2="280"/><line x1="310" y1="40" x2="310" y2="280"/><line x1="360" y1="40" x2="360" y2="280"/>
    <line x1="410" y1="40" x2="410" y2="280"/><line x1="460" y1="40" x2="460" y2="280"/>
  </g>
  <!-- Axes -->
  <line x1="60" y1="280" x2="490" y2="280" stroke="#334155" stroke-width="2" marker-end="url(#ax)"/>
  <line x1="60" y1="280" x2="60" y2="25" stroke="#334155" stroke-width="2" marker-end="url(#ax)"/>
  <text x="488" y="305" text-anchor="end" font-size="13" fill="#334155">V<tspan font-size="10" dy="3">in</tspan></text>
  <text x="68" y="25" font-size="13" fill="#334155">N (code de sortie)</text>
  <!-- Graduations -->
  <g font-size="12" fill="#334155" text-anchor="middle">
    <text x="60" y="298">0</text><text x="110" y="298">q</text><text x="160" y="298">2q</text><text x="210" y="298">3q</text>
    <text x="260" y="298">4q</text><text x="310" y="298">5q</text><text x="360" y="298">6q</text><text x="410" y="298">7q</text><text x="460" y="298">8q</text>
  </g>
  <g font-size="12" fill="#334155" text-anchor="end">
    <text x="52" y="284">0</text><text x="52" y="254">1</text><text x="52" y="224">2</text><text x="52" y="194">3</text>
    <text x="52" y="164">4</text><text x="52" y="134">5</text><text x="52" y="104">6</text><text x="52" y="74">7</text>
  </g>
  <!-- Caractéristique en escalier -->
  <polyline fill="none" stroke="#2563eb" stroke-width="3.5"
    points="60,280 110,280 110,250 160,250 160,220 210,220 210,190 260,190 260,160 310,160 310,130 360,130 360,100 410,100 410,70 460,70"/>
  <line x1="60" y1="280" x2="460" y2="40" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="300" y="320" text-anchor="middle" font-size="11" fill="#64748b">CAN 3 bits — caractéristique de transfert (tension d'entrée en multiples du quantum q)</text>
</svg>
