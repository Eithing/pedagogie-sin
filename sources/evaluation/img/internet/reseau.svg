<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" font-family="Inter, Segoe UI, sans-serif">
  <!-- Liaisons -->
  <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round">
    <line x1="110" y1="80" x2="180" y2="80"/>
    <line x1="110" y1="245" x2="180" y2="245"/>
    <line x1="180" y1="80" x2="310" y2="55"/>
    <line x1="180" y1="80" x2="180" y2="245"/>
    <line x1="310" y1="55" x2="450" y2="55"/>
    <line x1="310" y1="55" x2="310" y2="195"/>
    <line x1="180" y1="245" x2="310" y2="195"/>
    <line x1="450" y1="55" x2="580" y2="150"/>
    <line x1="310" y1="195" x2="450" y2="250"/>
    <line x1="450" y1="250" x2="580" y2="150"/>
    <line x1="580" y1="150" x2="625" y2="150"/>
  </g>

  <!-- Routeurs -->
  <g fill="#0d9488" stroke="#fff" stroke-width="4">
    <circle cx="180" cy="80" r="25"/>
    <circle cx="310" cy="55" r="25"/>
    <circle cx="180" cy="245" r="25"/>
    <circle cx="450" cy="55" r="25"/>
    <circle cx="310" cy="195" r="25"/>
    <circle cx="450" cy="250" r="25"/>
    <circle cx="580" cy="150" r="25"/>
  </g>
  <g fill="#fff" font-size="17" font-weight="700" text-anchor="middle">
    <text x="180" y="86">R1</text>
    <text x="310" y="61">R2</text>
    <text x="180" y="251">R3</text>
    <text x="450" y="61">R4</text>
    <text x="310" y="201">R5</text>
    <text x="450" y="256">R6</text>
    <text x="580" y="156">R7</text>
  </g>

  <!-- Extrémités -->
  <rect x="15" y="55" width="95" height="50" rx="10" fill="#1e293b"/>
  <text x="62" y="86" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Lycée</text>
  <rect x="15" y="220" width="95" height="50" rx="10" fill="#1e293b"/>
  <text x="62" y="251" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Maison</text>
  <rect x="625" y="122" width="90" height="56" rx="10" fill="#1e293b"/>
  <text x="670" y="146" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">Serveur</text>
  <text x="670" y="164" text-anchor="middle" fill="#99f6e4" font-size="12">web</text>
</svg>
