<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 230" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="ax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="50" y1="180" x2="410" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#ax)"/>
  <line x1="50" y1="180" x2="50" y2="25" stroke="#334155" stroke-width="2" marker-end="url(#ax)"/>
  <text x="408" y="205" text-anchor="end" font-size="13" fill="#334155">T (°C)</text>
  <text x="58" y="25" font-size="13" fill="#334155">Alarme</text>
  <text x="40" y="74" text-anchor="end" font-size="13" fill="#334155">1</text>
  <text x="40" y="174" text-anchor="end" font-size="13" fill="#334155">0</text>

  <!-- Graduations -->
  <g stroke="#94a3b8" stroke-dasharray="4 4">
    <line x1="180" y1="70" x2="180" y2="180"/>
    <line x1="260" y1="70" x2="260" y2="180"/>
  </g>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <text x="180" y="198" fill="#15803d">−17</text>
    <text x="260" y="198" fill="#dc2626">−15</text>
  </g>
  <text x="180" y="218" text-anchor="middle" font-size="11" fill="#15803d">retour à la normale</text>
  <text x="270" y="218" text-anchor="middle" font-size="11" fill="#dc2626">déclenchement</text>

  <!-- Cycle -->
  <g stroke="#dc2626" stroke-width="3.5" fill="none">
    <line x1="70" y1="170" x2="255" y2="170" marker-end="url(#fl)"/>
    <line x1="260" y1="170" x2="260" y2="76" marker-end="url(#fl)"/>
    <line x1="390" y1="70" x2="185" y2="70" marker-end="url(#fl)"/>
    <line x1="180" y1="70" x2="180" y2="164" marker-end="url(#fl)"/>
  </g>
  <text x="120" y="160" text-anchor="middle" font-size="11" fill="#475569">la température monte</text>
  <text x="330" y="60" text-anchor="middle" font-size="11" fill="#475569">la température redescend</text>
</svg>
