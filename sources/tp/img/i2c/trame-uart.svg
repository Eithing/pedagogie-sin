<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 150" font-family="Inter, Segoe UI, sans-serif">
  <rect width="680" height="150" fill="#ffffff"/>
  <text x="12" y="25" font-size="13" fill="#475569">Ligne TX, au repos à 1 — 9 600 bauds, 8 bits de données, sans parité, 1 bit de stop (8N1)</text>
  <text x="14" y="58" font-size="14" font-weight="700" fill="#334155">1</text>
  <text x="14" y="108" font-size="14" font-weight="700" fill="#334155">0</text>
  <g stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4">
    <line x1="80" y1="40" x2="80" y2="112"/>
    <line x1="130" y1="40" x2="130" y2="112"/>
    <line x1="180" y1="40" x2="180" y2="112"/>
    <line x1="230" y1="40" x2="230" y2="112"/>
    <line x1="280" y1="40" x2="280" y2="112"/>
    <line x1="330" y1="40" x2="330" y2="112"/>
    <line x1="380" y1="40" x2="380" y2="112"/>
    <line x1="430" y1="40" x2="430" y2="112"/>
    <line x1="480" y1="40" x2="480" y2="112"/>
    <line x1="530" y1="40" x2="530" y2="112"/>
    <line x1="580" y1="40" x2="580" y2="112"/>
  </g>
  <path d="M40 54 H80 V104 H130 H180 V54 H230 H280 V104 H330 H380 H430 V54 H480 V104 H530 V54 H580 H640" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"/>
  <g font-size="12" fill="#0f172a" text-anchor="middle">
    <text x="105" y="130">start</text>
    <text x="155" y="130">D0</text>
    <text x="205" y="130">D1</text>
    <text x="255" y="130">D2</text>
    <text x="305" y="130">D3</text>
    <text x="355" y="130">D4</text>
    <text x="405" y="130">D5</text>
    <text x="455" y="130">D6</text>
    <text x="505" y="130">D7</text>
    <text x="555" y="130">stop</text>
  </g>
  <text x="330" y="146" font-size="11" fill="#475569" text-anchor="middle">D0 est le bit de poids faible : il est envoyé en premier.</text>
</svg>
