<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="Inter, Segoe UI, sans-serif">
  <rect width="1000" height="440" fill="#ffffff"/>
  <text x="500" y="38" text-anchor="middle" font-size="26" font-weight="800" fill="#0f172a">Le jeu des réflexes sur ESP32</text>

  <!-- carte -->
  <rect x="380" y="90" width="240" height="230" rx="14" fill="#1e293b"/>
  <rect x="440" y="130" width="120" height="90" rx="8" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  <text x="500" y="182" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">ESP32</text>
  <text x="500" y="260" text-anchor="middle" font-size="16" fill="#cbd5e1">le programme</text>
  <text x="500" y="284" text-anchor="middle" font-size="16" fill="#cbd5e1">jeu_reflexes.py</text>

  <!-- LED verte -->
  <circle cx="160" cy="130" r="34" fill="#22c55e" stroke="#15803d" stroke-width="4"/>
  <text x="160" y="196" text-anchor="middle" font-size="17" font-weight="800" fill="#15803d">LED verte (18)</text>
  <text x="160" y="218" text-anchor="middle" font-size="15" fill="#334155">« Appuie ! »</text>
  <line x1="196" y1="130" x2="380" y2="150" stroke="#15803d" stroke-width="3"/>

  <!-- LED rouge -->
  <circle cx="160" cy="300" r="34" fill="#fecaca" stroke="#dc2626" stroke-width="4"/>
  <text x="160" y="366" text-anchor="middle" font-size="17" font-weight="800" fill="#dc2626">LED rouge (19)</text>
  <text x="160" y="388" text-anchor="middle" font-size="15" fill="#334155">« Triche ! »</text>
  <line x1="196" y1="300" x2="380" y2="280" stroke="#dc2626" stroke-width="3"/>

  <!-- bouton -->
  <rect x="780" y="100" width="110" height="80" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
  <circle cx="835" cy="140" r="26" fill="#2563eb"/>
  <text x="835" y="210" text-anchor="middle" font-size="17" font-weight="800" fill="#1d4ed8">Bouton (15)</text>
  <text x="835" y="232" text-anchor="middle" font-size="15" fill="#334155">le joueur</text>
  <line x1="780" y1="140" x2="620" y2="150" stroke="#2563eb" stroke-width="3"/>

  <!-- moniteur série -->
  <rect x="660" y="270" width="320" height="120" rx="10" fill="#0f172a"/>
  <text x="680" y="300" font-size="15" fill="#94a3b8">Moniteur série</text>
  <text x="680" y="330" font-size="17" font-family="Consolas, monospace" fill="#86efac">Manche 1 : attention...</text>
  <text x="680" y="358" font-size="17" font-family="Consolas, monospace" fill="#86efac">Temps : 287 ms</text>
  <line x1="620" y1="290" x2="660" y2="310" stroke="#94a3b8" stroke-width="3"/>

  <text x="500" y="420" text-anchor="middle" font-size="17" fill="#334155">La LED verte s'allume au hasard. Le plus rapide à appuyer gagne.</text>
</svg>
