<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="Inter, Segoe UI, sans-serif">
  <!-- Arduino Uno -->
  <rect x="380" y="40" width="290" height="200" rx="12" fill="#0e7490"/>
  <text x="525" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Arduino Uno (Tinkercad)</text>
  <rect x="480" y="100" width="120" height="60" rx="4" fill="#1e293b"/>
  <text x="540" y="135" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">ATmega328P</text>
  <text x="540" y="180" text-anchor="middle" fill="#cffafe" font-size="11">CAN 10 bits, pleine échelle 5 V</text>
  <g fill="#fff" font-size="12" font-weight="700">
    <text x="392" y="74">5V</text><text x="392" y="124">GND</text><text x="392" y="174">A0</text>
  </g>
  <g fill="#fbbf24"><rect x="378" y="64" width="8" height="14"/><rect x="378" y="114" width="8" height="14"/><rect x="378" y="164" width="8" height="14"/></g>
  <!-- LED L intégrée -->
  <circle cx="640" cy="70" r="9" fill="#f97316"/>
  <text x="640" y="95" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">L (broche 13)</text>
  <rect x="640" y="200" width="30" height="22" rx="2" fill="#94a3b8"/>
  <text x="600" y="215" text-anchor="end" fill="#cffafe" font-size="10">USB → moniteur série</text>

  <!-- TMP36 -->
  <path d="M90 110 h60 v60 a30 30 0 0 1 -60 0 z" fill="#1e293b"/>
  <text x="120" y="150" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">TMP36</text>
  <g stroke="#64748b" stroke-width="4"><line x1="100" y1="110" x2="100" y2="70"/><line x1="120" y1="110" x2="120" y2="70"/><line x1="140" y1="110" x2="140" y2="70"/></g>
  <g font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">
    <text x="92" y="62">+Vs</text><text x="120" y="50">Vout</text><text x="150" y="62">GND</text>
  </g>

  <!-- Fils -->
  <g fill="none" stroke-width="3.5">
    <path d="M100 70 V35 H330 V71 H378" stroke="#dc2626"/>
    <path d="M140 70 V85 H300 V121 H378" stroke="#0f172a"/>
    <path d="M120 70 V55 H230 V171 H378" stroke="#2563eb"/>
  </g>

  <!-- Multimètre -->
  <rect x="190" y="200" width="110" height="80" rx="10" fill="#facc15" stroke="#a16207" stroke-width="2"/>
  <rect x="202" y="210" width="86" height="30" rx="3" fill="#1e293b"/>
  <text x="245" y="231" text-anchor="middle" fill="#4ade80" font-size="15" font-family="Consolas, monospace">?.??? V</text>
  <text x="245" y="265" text-anchor="middle" fill="#713f12" font-size="12" font-weight="700">Multimètre (V)</text>
  <g fill="none" stroke-width="2" stroke-dasharray="5 3">
    <path d="M230 171 V200" stroke="#2563eb"/>
    <path d="M300 121 V240 H300" stroke="#0f172a"/>
  </g>
  <text x="30" y="250" font-size="11" fill="#64748b">Le curseur du TMP36 (clic pendant la simulation)</text>
  <text x="30" y="265" font-size="11" fill="#64748b">règle la température de −40 °C à +125 °C.</text>
</svg>
